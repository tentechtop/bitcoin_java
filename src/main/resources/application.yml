server:
  address: ${NODE_HTTP_ADDRESS:127.0.0.1}
  port: ${NODE_HTTP_PORT:18333}
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    threads:
      max: 64
      min-spare: 4
    max-connections: 256
    accept-count: 64
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: bitcoin-java
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
node:
  api:
    admin-token: ${NODE_ADMIN_TOKEN:}
    read-token: ${NODE_READ_TOKEN:}
    public-read: false
system:
  path: ${NODE_DATA_DIR:./data/local-v2}
  net-params: RegressionNetParams
  quic-port: ${NODE_P2P_PORT:18444}
  p2p-bind-address: ${NODE_P2P_ADDRESS:127.0.0.1}
  networking-enabled: ${NODE_NETWORKING_ENABLED:true}
  db-sync-writes: true
  min-free-disk-bytes: ${NODE_MIN_FREE_DISK_BYTES:268435456}
  readiness-min-peers: ${NODE_READINESS_MIN_PEERS:0}
  readiness-max-sync-lag: ${NODE_READINESS_MAX_SYNC_LAG:2}
  mining-type: 1
  miner-address-list: []
  bootstrap: []
  is-stun: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,node
protocol:
  min_supported_version: 1
  max_supported_version: 3
  default_send_version: 3
  deprecated_versions: [0]
  enable_version_fallback: false
