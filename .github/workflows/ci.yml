name: Production verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile, unit tests, executable multi-node and storage integration tests, SBOM
        run: bash ./mvnw -B -ntp -s .mvn/settings.xml -Pci clean verify
      - name: Exercise packaged backup, restore, reindex and health commands
        run: |
          source_db=$(find target -maxdepth 2 -type d -path 'target/multi-node-*/a' -print -quit)
          test -n "$source_db"
          python scripts/smoke_maintenance.py "$source_db" --expected-height 7
      - name: Resolve and audit runtime dependencies
        run: |
          bash ./mvnw -B -ntp -s .mvn/settings.xml dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python scripts/audit_dependencies.py
          python scripts/verify_artifacts.py target/runtime-dependencies.txt "$HOME/.m2/repository"
      - name: Check repeat packaging produces the same executable artifact
        run: |
          sha256sum target/bitcoin_java-0.0.1-SNAPSHOT.jar > target/reproducible.sha256
          bash ./mvnw -B -ntp -s .mvn/settings.xml -DskipTests -DskipITs package
          sha256sum --check target/reproducible.sha256
      - name: Build and exercise the container on Linux
        if: runner.os == 'Linux'
        run: |
          docker build --tag bitcoin-java:ci .
          docker run --detach --name node-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --memory 3g --pids-limit 256 --tmpfs /tmp:rw,nosuid,size=128m -e SPRING_PROFILES_ACTIVE=local -e NODE_NETWORKING_ENABLED=false -e NODE_READINESS_MIN_PEERS=0 -e NODE_ADMIN_TOKEN=ci-only-ephemeral-token-not-for-deployment bitcoin-java:ci
          trap 'docker logs node-smoke; docker rm --force --volumes node-smoke' EXIT
          for attempt in $(seq 1 24); do
            if docker exec node-smoke java -Dloader.main=com.bit.coin.ops.NodeProbe -cp /opt/node/app.jar org.springframework.boot.loader.launch.PropertiesLauncher; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Retain test reports and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}
          retention-days: 14
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/classes/META-INF/sbom/application.cdx.json
            target/dependency-audit.json
            target/artifact-integrity.json
            target/reproducible.sha256
            target/maintenance-launcher.json
            target/maintenance-smoke-*/*.log
            target/multi-node-*/result.txt
            target/multi-node-*/*.log
